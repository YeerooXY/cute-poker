<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cute Poker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <link href="/static/styles.css?v=7" rel="stylesheet">
</head>
<body>
  <!-- Connect screen -->
  <div id="connectScreen" class="connect-screen">
    <div class="bg-symbols" aria-hidden="true">
      <span>♠</span><span>♥</span><span>♦</span><span>♣</span>
      <span>♠</span><span>♥</span><span>♦</span><span>♣</span>
      <span>♠</span><span>♥</span><span>♦</span><span>♣</span>
      <span>♠</span><span>♥</span><span>♦</span><span>♣</span>
    </div>
    <div class="connect-box">
      <h1>🃏 Cute Poker</h1>
      <p class="subtitle">Private Texas Hold'em for friends</p>

      <label>Your name</label>
      <input id="nameInput" placeholder="Nemo" maxlength="20">

      <div class="avatar-picker">
        <label>Avatar</label>
        <div id="avatarOptions" class="avatar-options">
          <span class="avatar-opt selected" data-av="🎭">🎭</span>
          <span class="avatar-opt" data-av="😎">😎</span>
          <span class="avatar-opt" data-av="🦊">🦊</span>
          <span class="avatar-opt" data-av="🐱">🐱</span>
          <span class="avatar-opt" data-av="🦁">🦁</span>
          <span class="avatar-opt" data-av="🐺">🐺</span>
          <span class="avatar-opt" data-av="🦅">🦅</span>
          <span class="avatar-opt" data-av="🐉">🐉</span>
          <span class="avatar-opt" data-av="🎲">🎲</span>
          <span class="avatar-opt" data-av="💎">💎</span>
          <span class="avatar-opt" data-av="🔥">🔥</span>
          <span class="avatar-opt" data-av="⭐">⭐</span>
        </div>
      </div>

      <button id="createBtn" class="btn btn-gold btn-lg">Create Room</button>

      <!-- Room settings (collapsible) -->
      <div class="room-settings">
        <div class="room-settings-header" role="button" tabindex="0">
          <span>⚙ Room Settings</span>
          <span class="chevron">▸</span>
        </div>
        <div class="room-settings-body collapsed">
          <div class="setting-row">
            <label for="blindIncreaseInput">Blind increase every</label>
            <div class="setting-value">
              <input id="blindIncreaseInput" type="number" value="0" min="0" max="100" step="5">
              <span>hands</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="anteInput">Ante</label>
            <div class="setting-value">
              <input id="anteInput" type="number" value="0" min="0" max="50">
              <span>chips</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="anteModeSelect">Ante mode</label>
            <div class="setting-value">
              <select id="anteModeSelect">
                <option value="classic">Classic (all post)</option>
                <option value="bba">BBA (dealer posts 1 BB)</option>
              </select>
            </div>
          </div>
          <div class="setting-row">
            <label for="autoAnteCheck">Auto-scale ante with blinds</label>
            <div class="setting-value">
              <input id="autoAnteCheck" type="checkbox">
            </div>
          </div>
          <div class="setting-row">
            <label for="allowFoldedRevealsCheck">Allow folded hand reveals after hand</label>
            <div class="setting-value">
              <input id="allowFoldedRevealsCheck" type="checkbox" checked>
            </div>
          </div>
          <p class="setting-hint">BBA = Big Blind Ante (dealer posts 1 BB). Classic = everyone posts. Set 0 to disable ante.</p>
        </div>
      </div>

      <div class="join-row">
        <input id="roomInput" placeholder="ROOM CODE" maxlength="10">
        <button id="joinBtn" class="btn btn-green">Join</button>
      </div>

      <button id="reconnectBtn" class="btn btn-dim btn-sm">Reconnect Last Session</button>

      <!-- Active rooms list -->
      <div id="roomsList" class="rooms-list"></div>

      <!-- Game History Panel -->
      <div class="game-history-panel">
        <div class="game-history-header" role="button" aria-expanded="false" tabindex="0">
          <span>Game History (<span id="historyCount">0</span>)</span>
          <span class="chevron">▸</span>
        </div>
        <div class="game-history-body collapsed">
        </div>
      </div>

      <p id="status" class="status-msg"></p>
    </div>
  </div>

  <!-- Game screen -->
  <div id="gameScreen" class="game-screen hidden">
    <!-- Top HUD -->
    <div class="hud-top">
      <div class="hud-left">
        <button id="leaveBtn" class="btn btn-tiny btn-dim">✕ Leave</button>
        <span id="roomId" class="room-code"></span>
        <button id="copyRoomBtn" class="btn btn-tiny btn-dim">📋</button>
      </div>
      <div class="hud-right">
        <span id="blindInfo" class="blind-info"></span>
        <span id="phaseBadge" class="phase-badge"></span>
        <button id="bbToggleBtn" class="btn btn-tiny btn-dim" title="Toggle Big Blind unit display">BB</button>
        <button id="hintsToggle" class="btn btn-tiny btn-dim">💡</button>
        <button id="chatToggle" class="btn btn-tiny btn-dim">💬</button>
      </div>
    </div>

    <!-- The poker table -->
    <div class="poker-table">
      <!-- The felt (center) -->
      <div class="table-felt">
        <div class="pot-area">
          <span class="pot-label">POT</span>
          <span id="potValue" class="pot-amount">0</span>
          <div id="potChips" class="pot-chips"></div>
        </div>
        <div id="community" class="community-cards"></div>
        <div id="outsBox" class="outs-box hidden"></div>
        <div id="turnInfo" class="turn-indicator"></div>
      </div>

      <!-- Player positions (around the table) -->
      <div id="playerPositions" class="player-positions"></div>
    </div>

    <!-- Winner overlay -->
    <div id="winnerOverlay" class="winner-overlay hidden">
      <div id="winnerContent" class="winner-content"></div>
    </div>

    <!-- Your hand bar -->
    <div id="yourHandBar" class="your-hand-bar hand-bar-hidden">
      <div id="yourCards" class="your-cards"></div>
      <div id="handStrength" class="hand-strength-badge"></div>
    </div>

    <!-- Showdown tray -->
    <section id="showdownTray" class="showdown-tray hidden" aria-live="polite"></section>

    <!-- Post-hand summary -->
    <div id="postHandPanel" class="post-hand-panel hidden">
      <div class="post-hand-header">
        <div>
          <div id="postHandKicker" class="post-hand-kicker">Hand complete</div>
          <div id="postHandTitle" class="post-hand-title"></div>
        </div>
        <div id="postHandPot" class="post-hand-pot"></div>
      </div>
      <div id="postHandBody" class="post-hand-body"></div>
      <div class="post-hand-actions">
        <button id="postHandDealBtn" class="btn btn-deal">Deal Next</button>
      </div>
    </div>

    <!-- Action bar -->
    <div id="actionBar" class="action-bar">
      <div class="action-row-main">
        <button id="foldBtn" class="btn btn-fold">Fold</button>
        <button id="checkCallBtn" class="btn btn-call">Check</button>
      </div>
      <div class="action-row-raise">
        <button id="betHalfPotBtn" class="btn btn-raise">½ Pot</button>
        <button id="betPotBtn" class="btn btn-raise">Pot</button>
        <button id="betAllInBtn" class="btn btn-allin">All-In</button>
      </div>
      <div class="action-row-custom">
        <input id="customBetInput" type="number" placeholder="Raise to..." min="1">
        <button id="customBetBtn" class="btn btn-raise">Raise</button>
      </div>
      <!-- Player options (inline with action bar) -->
      <div class="action-row-options">
        <button id="startBtn" class="btn btn-tiny btn-deal">▶ Deal</button>
        <span id="autoDealCountdown" class="auto-deal-countdown hidden"></span>
        <button id="autoDealToggle" class="btn btn-tiny btn-dim auto-deal-toggle" title="Auto-deal next hand after showdown">⏩ Auto</button>
        <button id="sitOutBtn" class="btn btn-tiny btn-dim">Sit Out</button>
        <button id="spectateBtn" class="btn btn-tiny btn-dim">Spectate</button>
      </div>
    </div>

    <!-- Admin side panel (right side) -->
    <div id="adminActions" class="admin-side-panel hidden">
      <button id="resetBtn" class="btn btn-tiny btn-dim">↺ Reset</button>
      <button id="pauseBtn" class="btn btn-tiny btn-dim">⏸ Pause</button>
      <select id="botDifficultySelect" class="bot-difficulty-select">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard" selected>Hard</option>
        <option value="expert">Expert</option>
      </select>
      <button id="addBotBtn" class="btn btn-tiny btn-dim">🤖+</button>
      <button id="removeBotBtn" class="btn btn-tiny btn-dim">🤖-</button>
    </div>

    <!-- Chat panel -->
    <div id="chatPanel" class="chat-panel hidden">
      <div class="chat-header">
        <span>Chat</span>
        <button id="chatClose" class="btn btn-tiny btn-dim">✕</button>
      </div>
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chatInput" placeholder="Message...">
        <button id="chatBtn" class="btn btn-dim">Send</button>
      </div>
    </div>

    <!-- Action Log panel -->
    <div id="actionLogPanel" class="action-log-panel">
      <div class="action-log-header">
        <span class="action-log-title">Hand #<span id="actionLogHandNum">0</span></span>
      </div>
      <div id="actionLogBody" class="action-log-body">
        <!-- Action entries rendered here -->
      </div>
    </div>
    <button id="actionLogToggle" class="action-log-toggle">◀</button>
  </div>

  <script src="/static/app.js?v=7"></script>
</body>
</html>
